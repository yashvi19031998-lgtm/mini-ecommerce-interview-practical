name: 1-Hour Auto Lead Scraper

on:
  schedule:
    # Runs at minute 23 of every hour (irregular minute avoids high-traffic 00:00 delays)
    - cron: '23 * * * *'
    # Extra backup trigger at minute 53 for guaranteed regular execution
    - cron: '53 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f test-demo/requirements.txt ]; then
            pip install -r test-demo/requirements.txt
          fi

      - name: Run All Scrapers & Lead Harvester
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          AUTO_SEND_EMAIL: 'true'
          MAX_PENDING_EMAILS_PER_RUN: '5'
        run: |
          cd test-demo
          python run_all_scrapers.py

      - name: Commit & Push Updated Leads CSVs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          
          if git diff --staged --quiet; then
            echo "No new leads found to commit."
          else
            git commit -m "Auto-update leads: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git pull --rebase --autostash origin master || true
            git push origin master
          fi


