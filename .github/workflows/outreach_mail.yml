name: Outreach Mail (office hours)

# Sends the intro e-mails to leads the scraper found and the AI scored, and checks Gmail for
# replies / bounces / opt-outs. No scraping here: that is auto_scraper_1hr.yml.
on:
  schedule:
    # Monday-Saturday, 10:37 AM, 1:37 PM and 4:37 PM India time (cron is UTC; odd minute = less queue delay)
    - cron: '7 5,8,11 * * 1-6'
  workflow_dispatch: # Manual run from the GitHub Actions tab

permissions:
  contents: read

# Same group as the scraper: the two never run at once (both read and write the same data).
concurrency:
  group: lead-data
  cancel-in-progress: false

jobs:
  send-mail:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Kolkata # "today" for the daily e-mail limit is the India date
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    defaults:
      run:
        working-directory: test-demo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: test-demo/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Without the sent-mail log nobody may be e-mailed: stop if the database cannot be read.
      - name: Load data from the database
        run: python datastore.py sync --required

      - name: Run e-mail safety tests
        id: tests
        run: python -m unittest test_email_limits test_email_safety test_followups test_followup_phase2 test_followup_extras test_outreach_split test_datastore test_lead_system

      - name: Gmail check and outreach e-mails
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          # Gmail reply check (defaults to SMTP_USER / SMTP_PASS when not set)
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          # --- settings (Settings -> Secrets and variables -> Actions -> Variables) ---
          AUTO_SEND_EMAIL: ${{ vars.AUTO_SEND_EMAIL || 'true' }}
          MAX_PENDING_EMAILS_PER_RUN: ${{ vars.MAX_PENDING_EMAILS_PER_RUN || '0' }}
          MAX_EMAILS_PER_DAY: ${{ vars.MAX_EMAILS_PER_DAY || '50' }}
          MIN_AI_SCORE_FOR_AUTO_EMAIL: ${{ vars.MIN_AI_SCORE_FOR_AUTO_EMAIL || '7' }}
          STALE_AFTER_DAYS: ${{ vars.STALE_AFTER_DAYS || '14' }}
          # Follow-up sequence: OFF unless the variable FOLLOWUP_AUTO_SEND = true
          FOLLOWUP_AUTO_SEND: ${{ vars.FOLLOWUP_AUTO_SEND || 'false' }}
          FOLLOWUP_SEQUENCE_DAYS: ${{ vars.FOLLOWUP_SEQUENCE_DAYS || '3,7,14' }}
          FOLLOWUP_MAX_PER_RUN: ${{ vars.FOLLOWUP_MAX_PER_RUN || '10' }}
        run: python run_all_scrapers.py --email-only

      - name: Save data to the database
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: python datastore.py sync --required
