name: 1-Hour Auto Lead Scraper

on:
  schedule:
    # Once per hour, at an off-peak minute (GitHub delays jobs scheduled at :00)
    - cron: '23 * * * *'
  workflow_dispatch: # Manual run from the GitHub Actions tab

permissions:
  contents: write

# Never run two scrapes at once: they would edit the same CSV and fight over the push.
# A run that starts while another is going waits for it instead of being dropped.
concurrency:
  group: lead-scraper
  cancel-in-progress: false

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 50 # a hung scraper must not burn 6 hours or overlap the next run
    # Log timestamps in India time, so the 12 AM daily report (daily_report.yml) counts the right day
    env:
      TZ: Asia/Kolkata

    defaults:
      run:
        working-directory: test-demo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: test-demo/requirements.txt

      # Company/contact pages downloaded in earlier runs (see html_cache_manager.py).
      # Kept in GitHub's cache storage, never committed to the public repo.
      - name: Restore saved HTML pages
        uses: actions/cache/restore@v4
        with:
          path: test-demo/html_cache
          key: html-cache-${{ github.run_id }}
          restore-keys: |
            html-cache-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # If the code is broken, stop here - before any scraping or emailing happens.
      - name: Run tests
        id: tests
        run: python -m unittest test_lead_system test_quality_and_auth test_feedly test_accuracy test_html_cache test_sources test_website_signals test_apollo test_job_portals test_followups test_followup_phase2 test_followup_extras test_crm_sources test_api_keys test_search_cache test_search_engine test_supabase_sync test_maps_sources test_global_directories test_realestate_sources test_ecommerce_sources test_adlibrary_sources test_whatsapp_sources test_social_sources test_indian_directories test_corporate_registries test_bulk_contacts test_web_crawler test_file_uploads test_website_analyzer test_domain_tools test_lead_cleanup test_lead_enrichment test_api_safety test_auto_scheduler_and_settings test_reports_engine test_email_limits test_email_safety test_gemini_option

      - name: Run all scrapers, AI qualification and alerts
        env:
          # --- secrets (Settings -> Secrets and variables -> Actions -> Secrets) ---
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Free AI option when ANTHROPIC_API_KEY is empty (https://aistudio.google.com/apikey)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          FEEDLY_ACCESS_TOKEN: ${{ secrets.FEEDLY_ACCESS_TOKEN }}
          FEEDLY_STREAM_IDS: ${{ secrets.FEEDLY_STREAM_IDS }}
          FEEDLY_FEEDS: ${{ secrets.FEEDLY_FEEDS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          # Gmail reply check (defaults to SMTP_USER / SMTP_PASS when not set)
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # --- settings (Settings -> Secrets and variables -> Actions -> Variables) ---
          # Auto-email is ON by default in 1-hour auto scraper (can be overridden via repo vars)
          AUTO_SEND_EMAIL: ${{ vars.AUTO_SEND_EMAIL || 'true' }}
          MAX_PENDING_EMAILS_PER_RUN: ${{ vars.MAX_PENDING_EMAILS_PER_RUN || '0' }}
          MAX_EMAILS_PER_DAY: ${{ vars.MAX_EMAILS_PER_DAY || '50' }}
          MIN_AI_SCORE_FOR_AUTO_EMAIL: ${{ vars.MIN_AI_SCORE_FOR_AUTO_EMAIL || '7' }}
          MIN_AI_SCORE_FOR_SLACK: ${{ vars.MIN_AI_SCORE_FOR_SLACK || '7' }}
          AI_QUALIFY_LIMIT: ${{ vars.AI_QUALIFY_LIMIT || '40' }}
          STALE_AFTER_DAYS: ${{ vars.STALE_AFTER_DAYS || '14' }}
          IDEAL_CLIENT_PROFILE: ${{ vars.IDEAL_CLIENT_PROFILE }}
          # Follow-up sequence: OFF unless the variable FOLLOWUP_AUTO_SEND = true
          FOLLOWUP_AUTO_SEND: ${{ vars.FOLLOWUP_AUTO_SEND || 'false' }}
          FOLLOWUP_SEQUENCE_DAYS: ${{ vars.FOLLOWUP_SEQUENCE_DAYS || '3,7,14' }}
          FOLLOWUP_MAX_PER_RUN: ${{ vars.FOLLOWUP_MAX_PER_RUN || '10' }}
          FEEDLY_KEYWORDS: ${{ vars.FEEDLY_KEYWORDS || 'senior developer,tech lead,8+ years,9+ years,lead engineer,full stack architect,staff engineer,next.js,react,python,flutter,budget' }}
          FREELANCER_QUERIES: ${{ vars.FREELANCER_QUERIES || 'senior developer,tech lead,full stack architect,nextjs react,python ai,flutter senior' }}
          APOLLO_SEARCH_KEYWORDS: ${{ vars.APOLLO_SEARCH_KEYWORDS || '"Senior Developer" OR "Tech Lead" OR "Lead Engineer" OR "Software Architect" OR "8+ years" OR "Next.js" OR "Full Stack"' }}
          APOLLO_ENRICH_LIMIT_PER_RUN: ${{ vars.APOLLO_ENRICH_LIMIT_PER_RUN || '15' }}
        run: python run_all_scrapers.py

      - name: Save HTML pages for the next run
        # Save even if a scraper failed part-way, so pages already downloaded aren't fetched again
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: test-demo/html_cache
          key: html-cache-${{ github.run_id }}

      - name: Commit & push updated lead data
        # Run even if the scrape step failed part-way (so leads already collected are kept),
        # but never when the tests failed
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Only lead data and run logs - never anything else the run created
          git add -- '*.csv' logs/

          if git diff --staged --quiet; then
            echo "No lead changes to commit."
            exit 0
          fi

          git commit -m "Auto-update leads: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          # Someone may have pushed meanwhile: rebase and retry, and fail loudly if it never works
          for attempt in 1 2 3; do
            if git pull --rebase origin master && git push origin master; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          echo "::error::Could not push lead updates after 3 attempts."
          exit 1
