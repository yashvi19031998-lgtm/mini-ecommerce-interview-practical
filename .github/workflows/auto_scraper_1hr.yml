name: 1-Hour Auto Lead Scraper

on:
  schedule:
    # Runs hourly at :15 past the hour
    - cron: '15 * * * *'
  workflow_dispatch: # Manual run from the GitHub Actions tab

# Lead data lives in the Supabase database (one table, see test-demo/docs/database.md), not in git.
permissions:
  contents: read

# This job only finds leads; e-mail goes out from outreach_mail.yml at office hours.
# Same group as outreach_mail.yml: the two never run at once (both read and write the same data).
# A run that starts while another is going waits for it instead of being dropped.
concurrency:
  group: lead-data
  cancel-in-progress: false

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest
    timeout-minutes: 50 # a hung scraper must not burn 6 hours or overlap the next run
    # Log timestamps in India time, so the 12 AM daily report (daily_report.yml) counts the right day
    env:
      TZ: Asia/Kolkata
      # The database (SUPABASE_KEY must be the service_role key: Supabase -> Project Settings -> API)
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    defaults:
      run:
        working-directory: test-demo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: test-demo/requirements.txt

      # Company/contact pages downloaded in earlier runs (see html_cache_manager.py).
      # Kept in GitHub's cache storage, never committed to the public repo.
      - name: Restore saved HTML pages
        uses: actions/cache/restore@v4
        with:
          path: test-demo/html_cache
          key: html-cache-${{ github.run_id }}
          restore-keys: |
            html-cache-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Leads, sent-mail log, follow-ups and settings come from the database. If it cannot be read,
      # stop here: without the sent-mail log the run could e-mail people a second time.
      - name: Load data from the database
        run: python datastore.py sync --required

      # If the code is broken, stop here - before any scraping happens.
      - name: Run tests
        id: tests
        run: python -m unittest test_lead_system test_quality_and_auth test_feedly test_accuracy test_html_cache test_sources test_website_signals test_apollo test_job_portals test_followups test_followup_phase2 test_followup_extras test_crm_sources test_api_keys test_search_cache test_search_engine test_supabase_sync test_maps_sources test_global_directories test_realestate_sources test_ecommerce_sources test_adlibrary_sources test_whatsapp_sources test_social_sources test_indian_directories test_corporate_registries test_bulk_contacts test_web_crawler test_file_uploads test_website_analyzer test_domain_tools test_lead_cleanup test_lead_enrichment test_api_safety test_auto_scheduler_and_settings test_reports_engine test_email_limits test_email_safety test_gemini_option test_chatbots test_followup_untouched test_datastore test_outreach_split

      - name: Run all scrapers, AI qualification and alerts (no e-mail)
        env:
          # --- secrets (Settings -> Secrets and variables -> Actions -> Secrets) ---
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Free AI option when ANTHROPIC_API_KEY is empty (https://aistudio.google.com/apikey)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          FEEDLY_ACCESS_TOKEN: ${{ secrets.FEEDLY_ACCESS_TOKEN }}
          FEEDLY_STREAM_IDS: ${{ secrets.FEEDLY_STREAM_IDS }}
          FEEDLY_FEEDS: ${{ secrets.FEEDLY_FEEDS }}
          # --- settings (Settings -> Secrets and variables -> Actions -> Variables) ---
          # (e-mail settings live in outreach_mail.yml)
          MIN_AI_SCORE_FOR_SLACK: ${{ vars.MIN_AI_SCORE_FOR_SLACK || '7' }}
          AI_QUALIFY_LIMIT: ${{ vars.AI_QUALIFY_LIMIT || '40' }}
          STALE_AFTER_DAYS: ${{ vars.STALE_AFTER_DAYS || '14' }}
          IDEAL_CLIENT_PROFILE: ${{ vars.IDEAL_CLIENT_PROFILE }}
          FEEDLY_KEYWORDS: ${{ vars.FEEDLY_KEYWORDS || 'senior developer,tech lead,8+ years,9+ years,lead engineer,full stack architect,staff engineer,next.js,react,python,flutter,budget' }}
          FREELANCER_QUERIES: ${{ vars.FREELANCER_QUERIES || 'senior developer,tech lead,full stack architect,nextjs react,python ai,flutter senior,website development,mobile app,seo,digital marketing,social media marketing,google ads' }}
          APOLLO_SEARCH_KEYWORDS: ${{ vars.APOLLO_SEARCH_KEYWORDS || '"Senior Developer" OR "Tech Lead" OR "Lead Engineer" OR "Software Architect" OR "8+ years" OR "Next.js" OR "Full Stack"' }}
          APOLLO_ENRICH_LIMIT_PER_RUN: ${{ vars.APOLLO_ENRICH_LIMIT_PER_RUN || '15' }}
        run: python run_all_scrapers.py --no-email

      - name: Save HTML pages for the next run
        # Save even if a scraper failed part-way, so pages already downloaded aren't fetched again
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: test-demo/html_cache
          key: html-cache-${{ github.run_id }}

      - name: Save data to the database
        # Run even if the scrape step failed part-way (so leads already collected are kept),
        # but never when the tests failed
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: python datastore.py sync --required
