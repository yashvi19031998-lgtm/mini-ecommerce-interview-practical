name: Freelance & Project Leads Scraper

on:
  schedule:
    # Runs hourly at :30 past the hour (interleaved between general scraper at :15 and outreach at :45)
    - cron: '30 * * * *'
  workflow_dispatch: # Manual run from the GitHub Actions tab

permissions:
  contents: read

# Lead data lives in Supabase; concurrency group prevents simultaneous writes
concurrency:
  group: lead-data
  cancel-in-progress: false

jobs:
  freelance-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Kolkata
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    defaults:
      run:
        working-directory: test-demo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: test-demo/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Load data from the database
        run: python datastore.py sync --required

      - name: Run freelance & project scrapers (no e-mail)
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          FEEDLY_ACCESS_TOKEN: ${{ secrets.FEEDLY_ACCESS_TOKEN }}
          FEEDLY_STREAM_IDS: ${{ secrets.FEEDLY_STREAM_IDS }}
          FEEDLY_FEEDS: ${{ secrets.FEEDLY_FEEDS }}
          MIN_AI_SCORE_FOR_SLACK: ${{ vars.MIN_AI_SCORE_FOR_SLACK || '7' }}
          AI_QUALIFY_LIMIT: ${{ vars.AI_QUALIFY_LIMIT || '40' }}
          FREELANCER_QUERIES: ${{ vars.FREELANCER_QUERIES || 'senior developer,tech lead,full stack architect,nextjs react,python ai,flutter senior,website development,mobile app' }}
        run: python run_all_scrapers.py --group freelance --no-email

      - name: Save data to the database
        if: ${{ !cancelled() }}
        run: python datastore.py sync --required

